name: Android CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners provide the Android SDK. Resolve sdkmanager
      # from that installation instead of downloading a second command-line SDK.
      - name: Install Android API 36.1
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          fi
          test -n "$sdkmanager" && test -x "$sdkmanager"

          "$sdkmanager" --version
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      # Failures are surfaced as workflow annotations, which stay readable from the API and the
      # PR view without having to download and unzip the HTML report.
      - name: Annotate failing unit tests
        if: failure()
        shell: bash
        run: |
          shopt -s globstar nullglob
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          found = False
          for path in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      found = True
                      detail = " ".join((problem.get("message") or problem.text or "").split())[:700]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{detail}")
          if not found:
              print("::error title=Build::No test failures recorded - the build itself failed.")
          PY

      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zipslide-debug-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
